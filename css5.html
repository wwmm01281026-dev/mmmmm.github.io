<!DOCTYPE html>

<html>
    <head>
        <style>
            body{
                background-color: lightblue;
            }
        </style>

        <style>
            .rainbow-text{
                font-size: 36px;
                background: linear-gradient(to right, #ff0000,
                #ff7f00,#ffff00,#00ff00,#0000ff,#4b0082,#8a2be2);
            }
        </style>
    </head>

    <body>

        <h1 class="rainbow-text">這事漸層色彩</h1>

        <h1 style="background-color: red;">顏色單詞式表達</h1>

        <h1 style="background-color: rgb(225, 0, 0);">三原色值表達</h1>

        <h1 style="background-color: #ff6347;">16進位表達</h1>

        <h1 style="background-color: hsl(177, 100%, 64%);">HSL表達</h1>
        <!--HSL即色相HUE、飽和度Saturation、亮度Lightness-->

        <h1 style="background-color:rgb(255, 0, 0,0.3);">rgb(255, 0, 0,0.3)</h1>
        <!--0.3 = alpha值-->

        <h1 style="border: 2px dashed blue;">外框顏色樣式Z</h1>


    </body>
</html>
